# Supabase project config (used by `supabase start` / `supabase functions deploy`).
project_id = "physical-memory"

[auth]
# Sign in with Apple / Google only (native ID tokens via signInWithIdToken).
# Browsing works without an account; storing data, scanning and purchases require one.
enable_anonymous_sign_ins = false
# Email sign-in links open the app (PKCE code exchange in src/app/auth-callback.tsx).
additional_redirect_urls = ["pm://auth-callback"]

[auth.external.apple]
enabled = true
# Comma-separated audiences: the iOS bundle id (native sign-in).
client_id = "app.physicalmemory"
secret = ""

[auth.external.google]
enabled = true
# Web client ID first, then iOS and Android client IDs (all accepted as token audiences).
client_id = "env(GOOGLE_WEB_CLIENT_ID),env(GOOGLE_IOS_CLIENT_ID),env(GOOGLE_ANDROID_CLIENT_ID)"
secret = "env(GOOGLE_WEB_CLIENT_SECRET)"
# The native iOS Google SDK adds a nonce the app can't read; Supabase must skip that check.
skip_nonce_check = true

[storage]
file_size_limit = "10MiB"

[functions.analyze-scene]
import_map = "./functions/deno.json"
verify_jwt = true

[functions.interpret-query]
import_map = "./functions/deno.json"
verify_jwt = true

[functions.embed]
import_map = "./functions/deno.json"
verify_jwt = true

[functions.delete-account]
import_map = "./functions/deno.json"
verify_jwt = true

# Called by RevenueCat's servers; authenticated with REVENUECAT_WEBHOOK_SECRET instead of a user JWT.
[functions.revenuecat-webhook]
import_map = "./functions/deno.json"
verify_jwt = false
